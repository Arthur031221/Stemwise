[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stemwise"
version = "0.1.0"
description = "A local practice studio: split a song into stems, see chords and beats, slow it down without changing pitch, loop the hard bar."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arthur031221" }]
keywords = ["stem-separation", "demucs", "music-practice", "chord-recognition", "beat-tracking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Intended Audience :: End Users/Desktop",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10",
  "torch>=2.4",
  "demucs>=4.0.1",
  "beat_this>=1.1",
  "starlette>=0.37",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mir_eval>=0.7", "ruff>=0.6", "httpx>=0.27", "playwright>=1.45"]

[project.scripts]
stemwise = "stemwise.cli:main"

[project.urls]
Homepage = "https://github.com/Arthur031221/Stemwise"
Issues = "https://github.com/Arthur031221/Stemwise/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/stemwise"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "stemwise/web"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real models (deselect with -m 'not slow')", "e2e: drives a real browser"]
filterwarnings = ["ignore:Trying to estimate tuning from empty frequency set:UserWarning"]
